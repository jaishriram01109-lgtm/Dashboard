name: Deploy to Hostinger (nehank.com)

on:
  push:
    branches:
      - main
      - claude/smart-money-dashboard-in2L7
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          HOSTINGER: "true"
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_id }}-${{ github.run_number }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Delete files on server that are not in local build (clean deploy)
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
